[package]
name = "sentinel-responder"
version = "0.1.0"
edition = "2021"
description = "Restricted nftables response helper for Sentinel (fixed command set)"

[features]
default = []
# Live nftables round-trip. Skipped automatically when not root / not Linux.
nft-integration = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
